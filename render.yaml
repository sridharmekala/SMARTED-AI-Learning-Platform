services:
  - type: web
    name: smarted-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://your-frontend-domain.vercel.app
      - key: ADMIN_SEED_ENABLED
        value: true
      - key: ADMIN_SEED_NAME
        value: SMARTED Admin
      - key: ADMIN_SEED_EMAIL
        value: admin@smarted.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
