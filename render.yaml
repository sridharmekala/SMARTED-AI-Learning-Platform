services:
  - type: web
    name: smarted-backend
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USE_SSL
        value: true
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ADDON_HOST
        sync: false
      - key: MYSQL_ADDON_PORT
        value: 3306
      - key: MYSQL_ADDON_DB
        sync: false
      - key: MYSQL_ADDON_USER
        sync: false
      - key: MYSQL_ADDON_PASSWORD
        sync: false
      - key: DB_POOL_MAX_SIZE
        value: 2
      - key: DB_POOL_MIN_IDLE
        value: 0
      - key: DB_POOL_IDLE_TIMEOUT_MS
        value: 30000
      - key: DB_POOL_CONNECTION_TIMEOUT_MS
        value: 30000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://smarted-ai-learning-platform.vercel.app
      - key: ADMIN_SEED_ENABLED
        value: true
      - key: ADMIN_SEED_NAME
        value: SMARTED Admin
      - key: ADMIN_SEED_EMAIL
        value: admin@smarted.com
      - key: ADMIN_SEED_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1/chat/completions
