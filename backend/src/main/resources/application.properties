spring.application.name=smarted-backend
server.port=${PORT:8081}

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarted_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Helpful during development
spring.devtools.restart.enabled=true

# JWT configuration
jwt.secret=${JWT_SECRET:smarted-development-secret-key-change-this-value-before-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# NVIDIA NIM chatbot configuration
# Preferred: set NVIDIA_API_KEY to your nvapi-* key.
# Fallback keeps compatibility if you already placed the nvapi key in OPENAI_API_KEY.
nvidia.api-key=${NVIDIA_API_KEY:${OPENAI_API_KEY:}}
nvidia.model=${NVIDIA_MODEL:meta/llama-3.1-8b-instruct}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1/chat/completions}
