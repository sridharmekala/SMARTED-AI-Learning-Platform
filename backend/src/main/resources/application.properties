spring.application.name=smarted-backend
server.port=${PORT:8081}

# MySQL database configuration
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST:${DB_HOST:localhost}}:${MYSQL_ADDON_PORT:${DB_PORT:3306}}/${MYSQL_ADDON_DB:${DB_NAME:smarted_db}}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_ADDON_USER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQL_ADDON_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:2}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Helpful during development
spring.devtools.restart.enabled=true

# JWT configuration
jwt.secret=${JWT_SECRET:smarted-development-secret-key-change-this-value-before-production}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}

# Seeded admin account
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:true}
app.seed.admin.name=${ADMIN_SEED_NAME:SMARTED Admin}
app.seed.admin.email=${ADMIN_SEED_EMAIL:admin@smarted.com}
app.seed.admin.password=${ADMIN_SEED_PASSWORD:}

# NVIDIA NIM chatbot configuration
# Preferred: set NVIDIA_API_KEY to your nvapi-* key.
# Fallback keeps compatibility if you already placed the nvapi key in OPENAI_API_KEY.
nvidia.api-key=${NVIDIA_API_KEY:${OPENAI_API_KEY:}}
nvidia.model=${NVIDIA_MODEL:meta/llama-3.1-8b-instruct}
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1/chat/completions}
